name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Generated files are up to date
        run: |
          pnpm --filter @brain/api codegen
          pnpm --filter @brain/app codegen
          pnpm --filter @brain/module-pets codegen
          pnpm --filter @brain/ui build:theme
          git diff --exit-code
      - name: Typecheck
        run: pnpm typecheck
      - name: Test (unit + integration, with coverage thresholds)
        run: pnpm test:coverage
      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
