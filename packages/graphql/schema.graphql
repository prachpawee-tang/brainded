union MutationUpdatePreferencesResult = MutationUpdatePreferencesSuccess | UnauthenticatedError

type MutationUpdatePreferencesSuccess {
  data: Viewer!
}

interface Node {
  id: ID!
}

type NotFoundError implements Error {
  code: String!
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
}

type Pet implements Node {
  appointments: [PetAppointment!]!
  birthDate: LocalDate
  breed: String
  createdAt: DateTime!
  dosesOn(date: LocalDate!): [PetDose!]!
  id: ID!
  labResult(id: ID!): PetLabResult
  labResults(first: Int): [PetLabResult!]!
  latestWeight: PetWeight
  medications: [PetMedication!]!
  name: String!
  nextAppointment: PetAppointment
  notes: String
  photoUrl: String
  previousWeight: PetWeight
  sex: PetSex!
  species: PetSpecies!
  speciesOther: String
  timeline(after: String, before: String, first: Int, last: Int): PetTimelineConnection!
  weights(since: LocalDate): [PetWeight!]!
}

type PetAppointment {
  clinic: String
  id: ID!
  note: String
  reason: String!
  scheduledAt: DateTime!
  status: PetAppointmentStatus!
}

enum PetAppointmentStatus {
  CANCELLED
  DONE
  SCHEDULED
}

type PetAttachment {
  id: ID!
  url: String!
}

type PetDose {
  date: LocalDate!
  id: ID!
  medication: PetMedication!
  takenAt: DateTime
  time: String!
}

enum PetLabFlag {
  HIGH
  LOW
  NORMAL
  UNKNOWN
}

type PetLabResult {
  abnormalCount: Int!
  clinic: String
  id: ID!
  note: String
  photos: [PetAttachment!]!
  takenOn: LocalDate!
  title: String!
  values: [PetLabValue!]!
}

type PetLabValue {
  flag: PetLabFlag!
  id: ID!
  name: String!
  refHigh: Float
  refLow: Float
  unit: String
  value: Float!
}

input PetLabValueInput {
  name: String!
  refHigh: Float
  refLow: Float
  unit: String
  value: Float!
}

type PetMedication {
  dosage: String
  endOn: LocalDate
  everyDays: Int!
  id: ID!
  name: String!
  note: String
  startOn: LocalDate!
  times: [String!]!
}

enum PetNoteType {
  GENERAL
  GROOMING
  VACCINE
  VET_VISIT
}

enum PetSex {
  FEMALE
  MALE
  UNKNOWN
}

enum PetSpecies {
  CAT
  DOG
  OTHER
}

type PetTimelineConnection {
  edges: [PetTimelineConnectionEdge!]!
  pageInfo: PageInfo!
}

type PetTimelineConnectionEdge {
  cursor: String!
  node: PetTimelineEvent!
}

type PetTimelineEvent {
  body: String
  id: ID!
  kind: PetTimelineKind!
  occurredOn: LocalDate!
  weightGrams: Int
}

enum PetTimelineKind {
  APPOINTMENT_DONE
  LAB_RESULT
  MEDICATION_STARTED
  NOTE_GENERAL
  NOTE_GROOMING
  NOTE_VACCINE
  NOTE_VET_VISIT
  WEIGHT
}

type PetWeight {
  id: ID!
  measuredOn: LocalDate!
  note: String
  weightGrams: Int!
}

type Query {
  health: Health!
  node(id: ID!): Node
  nodes(ids: [ID!]!): [Node]!
  pet(id: ID!): Pet
  pets(after: String, before: String, first: Int, last: Int): QueryPetsConnection!
  viewer: Viewer
}

type QueryPetsConnection {
  edges: [QueryPetsConnectionEdge!]!
  pageInfo: PageInfo!
}

type QueryPetsConnectionEdge {
  cursor: String!
  node: Pet!
}

input SetDoseTakenInput {
  date: LocalDate!
  medicationId: ID!
  taken: Boolean!
  time: String!
}

input SetModuleEnabledInput {
  enabled: Boolean!
  moduleId: String!
}

input SetPetAppointmentStatusInput {
  id: ID!
  localDate: LocalDate
  status: PetAppointmentStatus!
}

enum ThemePreference {
  DARK
  LIGHT
  SYSTEM
}

type UnauthenticatedError implements Error {
  code: String!
}

input UpdatePetAppointmentInput {
  clinic: String
  id: ID!
  note: String
  reason: String!
  scheduledAt: String!
}

input UpdatePetInput {
  birthDate: LocalDate
  breed: String
  id: ID!
  name: String
  notes: String
  photoKey: String
  sex: PetSex
  species: PetSpecies
  speciesOther: String
}

input UpdatePetMedicationInput {
  dosage: String
  endOn: LocalDate
  everyDays: Int!
  id: ID!
  name: String!
  note: String
  startOn: LocalDate!
  times: [String!]!
}

input UpdatePreferencesInput {
  locale: Language
  theme: ThemePreference
}

type UserModule {
  enabled: Boolean!
  moduleId: String!
}

type ValidationError implements Error {
  code: String!
  issues: [ValidationIssue!]!
}

type ValidationIssue {
  code: String!
  path: [String!]!
}

type Viewer {
  email: String!
  id: ID!
  image: String
  locale: Language!
  modules: [UserModule!]!
  name: String!
  theme: ThemePreference!
  username: String
}
