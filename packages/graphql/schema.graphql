input AddPetAppointmentInput {
  clinic: String
  note: String
  petId: ID!
  reason: String!
  scheduledAt: String!
}

input AddPetLabResultInput {
  clinic: String
  note: String
  petId: ID!
  photoKeys: [String!]
  takenOn: LocalDate!
  title: String!
  values: [PetLabValueInput!]!
}

input AddPetMedicationInput {
  dosage: String
  endOn: LocalDate
  everyDays: Int!
  name: String!
  note: String
  petId: ID!
  startOn: LocalDate!
  times: [String!]!
}

input AddPetNoteInput {
  body: String!
  occurredOn: LocalDate!
  petId: ID!
  type: PetNoteType!
}

input ArchivePetInput {
  id: ID!
}

input CreatePetInput {
  birthDate: LocalDate
  breed: String
  name: String!
  notes: String
  photoKey: String
  sex: PetSex
  species: PetSpecies!
  speciesOther: String
}

"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the `date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.
"""
scalar DateTime

input DeletePetLabResultInput {
  id: ID!
}

interface Error {
  code: String!
}

type ForbiddenError implements Error {
  code: String!
}

type Health {
  database: Boolean!
  status: HealthStatus!
  time: DateTime!
}

enum HealthStatus {
  OK
}

enum Language {
  EN
  TH
}

"""
A local date string (i.e., with no associated timezone) in `YYYY-MM-DD` format, e.g. `2020-01-01`.
"""
scalar LocalDate

input LogPetWeightInput {
  measuredOn: LocalDate!
  note: String
  petId: ID!
  weightKg: Float!
}

type Mutation {
  addPetAppointment(input: AddPetAppointmentInput!): MutationAddPetAppointmentResult!
  addPetLabResult(input: AddPetLabResultInput!): MutationAddPetLabResultResult!
  addPetMedication(input: AddPetMedicationInput!): MutationAddPetMedicationResult!
  addPetNote(input: AddPetNoteInput!): MutationAddPetNoteResult!
  archivePet(input: ArchivePetInput!): MutationArchivePetResult!
  createPet(input: CreatePetInput!): MutationCreatePetResult!
  deletePetLabResult(input: DeletePetLabResultInput!): MutationDeletePetLabResultResult!
  logPetWeight(input: LogPetWeightInput!): MutationLogPetWeightResult!
  setDoseTaken(input: SetDoseTakenInput!): MutationSetDoseTakenResult!
  setModuleEnabled(input: SetModuleEnabledInput!): MutationSetModuleEnabledResult!
  setPetAppointmentStatus(input: SetPetAppointmentStatusInput!): MutationSetPetAppointmentStatusResult!
  updatePet(input: UpdatePetInput!): MutationUpdatePetResult!
  updatePetAppointment(input: UpdatePetAppointmentInput!): MutationUpdatePetAppointmentResult!
  updatePetMedication(input: UpdatePetMedicationInput!): MutationUpdatePetMedicationResult!
  updatePreferences(input: UpdatePreferencesInput!): MutationUpdatePreferencesResult!
}

union MutationAddPetAppointmentResult = MutationAddPetAppointmentSuccess | NotFoundError | UnauthenticatedError | ValidationError

type MutationAddPetAppointmentSuccess {
  data: PetAppointment!
}

union MutationAddPetLabResultResult = ForbiddenError | MutationAddPetLabResultSuccess | NotFoundError | UnauthenticatedError | ValidationError

type MutationAddPetLabResultSuccess {
  data: PetLabResult!
}

union MutationAddPetMedicationResult = MutationAddPetMedicationSuccess | NotFoundError | UnauthenticatedError | ValidationError

type MutationAddPetMedicationSuccess {
  data: PetMedication!
}

union MutationAddPetNoteResult = MutationAddPetNoteSuccess | NotFoundError | UnauthenticatedError | ValidationError

type MutationAddPetNoteSuccess {
  data: Pet!
}

union MutationArchivePetResult = MutationArchivePetSuccess | NotFoundError | UnauthenticatedError

type MutationArchivePetSuccess {
  data: Pet!
}

union MutationCreatePetResult = ForbiddenError | MutationCreatePetSuccess | UnauthenticatedError | ValidationError

type MutationCreatePetSuccess {
  data: Pet!
}

union MutationDeletePetLabResultResult = MutationDeletePetLabResultSuccess | NotFoundError | UnauthenticatedError

type MutationDeletePetLabResultSuccess {
  data: Pet!
}

union MutationLogPetWeightResult = MutationLogPetWeightSuccess | NotFoundError | UnauthenticatedError | ValidationError

type MutationLogPetWeightSuccess {
  data: Pet!
}

union MutationSetDoseTakenResult = MutationSetDoseTakenSuccess | NotFoundError | UnauthenticatedError

type MutationSetDoseTakenSuccess {
  data: PetDose!
}

union MutationSetModuleEnabledResult = MutationSetModuleEnabledSuccess | NotFoundError | UnauthenticatedError

type MutationSetModuleEnabledSuccess {
  data: UserModule!
}

union MutationSetPetAppointmentStatusResult = MutationSetPetAppointmentStatusSuccess | NotFoundError | UnauthenticatedError

type MutationSetPetAppointmentStatusSuccess {
  data: PetAppointment!
}

union MutationUpdatePetAppointmentResult = MutationUpdatePetAppointmentSuccess | NotFoundError | UnauthenticatedError | ValidationError

type MutationUpdatePetAppointmentSuccess {
  data: PetAppointment!
}

union MutationUpdatePetMedicationResult = MutationUpdatePetMedicationSuccess | NotFoundError | UnauthenticatedError | ValidationError

type MutationUpdatePetMedicationSuccess {
  data: PetMedication!
}

union MutationUpdatePetResult = ForbiddenError | MutationUpdatePetSuccess | NotFoundError | UnauthenticatedError | ValidationError

type MutationUpdatePetSuccess {
  data: Pet!
